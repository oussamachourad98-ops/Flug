[project]
name = "flug"
version = "0.1.0"
description = "Personal flight price monitor (Duffel / SerpApi Google Flights) with Telegram alerts and a dashboard"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "apscheduler>=3.10,<4",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
flug = "flug.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flug*"]

[tool.setuptools.package-data]
flug = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
