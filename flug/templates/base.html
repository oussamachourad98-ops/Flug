<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Flug{% endblock %} · Preis-Monitor</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f6f4; --surface: #fcfcfb; --border: #e3e2dd;
  --text: #0b0b0b; --text-2: #52514e; --muted: #7a7974;
  --accent: #2a78d6;
  --good: #008300; --bad: #c62d2c; --warn: #9a6700;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
  --series-5: #e87ba4; --series-6: #008300; --series-7: #6250d6; --series-8: #e34948;
  --grid: #ecebe7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --border: #2e2e2c;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8e86;
    --accent: #3987e5; --good: #3fb950; --bad: #f47067; --warn: #d4a72c;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --series-5: #d55181; --series-6: #0ca30c; --series-7: #9085e9; --series-8: #e66767;
    --grid: #262624;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { padding: 14px 16px; border-bottom: 1px solid var(--border); background: var(--surface);
  display: flex; gap: 16px; align-items: baseline; }
header a { color: var(--text); text-decoration: none; font-weight: 650; }
main { max-width: 1180px; margin: 0 auto; padding: 16px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
h1 { font-size: 1.35rem; margin: 0 0 12px; } h2 { font-size: 1.05rem; margin: 0 0 10px; }
.muted { color: var(--muted); } .small { font-size: .85rem; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--text-2); font-weight: 600; font-size: .85rem; }
td.num, th.num { text-align: right; white-space: nowrap; }
a { color: var(--accent); }
.badge { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: .78rem; border: 1px solid var(--border); color: var(--text-2); }
.badge.ok::before { content: "● "; color: var(--good); }
.badge.partial::before, .badge.skipped::before { content: "▲ "; color: var(--warn); }
.badge.failed::before { content: "✕ "; color: var(--bad); }
.below { color: var(--good); font-weight: 650; }
.below::after { content: " ✓"; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.stat .v { font-size: 1.5rem; font-weight: 650; font-variant-numeric: tabular-nums; }
.stat .l { color: var(--text-2); font-size: .85rem; }
form.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
input[type=text] { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); width: 9em; }
button { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
.chart-box { position: relative; height: 320px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 0 0 8px; font-size: .85rem; color: var(--text-2); }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.legend i.dash { background: repeating-linear-gradient(90deg, var(--text-2) 0 4px, transparent 4px 7px); }
</style>
</head>
<body>
<header><a href="/">✈ Flug</a><span class="muted small">Preis-Monitor</span></header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
